name: Build and deploy .NET Azure Function - WeatherAgent API

on:
  push:
    branches:
      - main
    paths:
      - 'src/WeatherAgent.API/**'
      - 'src/WeatherAgent.Application/**'
      - 'src/WeatherAgent.Infrastructure/**'
      - 'src/WeatherAgent.Domain/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/WeatherAgent.API/**'
      - 'src/WeatherAgent.Application/**'
      - 'src/WeatherAgent.Infrastructure/**'
      - 'src/WeatherAgent.Domain/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'weatheragent-api'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/WeatherAgent.API'
  DOTNET_VERSION: '10.0.x'

jobs:
  build_and_deploy_api:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy API
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build API
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          dotnet publish --configuration Release --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/publish'
